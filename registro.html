<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | INSTALLERSONTRUCK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="placeholder.css">
  <style>
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.25s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--orange);
    }
    .form-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      margin: 24px 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .form-checkbox input {
      margin-top: 3px;
    }
    .form-checkbox a {
      color: var(--yellow);
      text-decoration: underline;
    }
    .btn-back-corner {
      position: absolute;
      top: 24px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(255, 106, 0, 0.15);
      border: 1px solid var(--orange, #ff6a00);
      color: var(--orange, #ff6a00);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .btn-back-corner:hover {
      background: var(--orange, #ff6a00);
      color: #000;
      transform: translateX(-4px);
    }
    @media (max-width: 600px) {
      .btn-back-corner { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <a href="javascript:history.back()" class="btn-back-corner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Regresar
  </a>
  <main class="placeholder-page">
    <div class="placeholder-card" style="max-width: 540px;">
      <span class="placeholder-eyebrow">Únete a la Comunidad</span>
      <h1 style="font-size: clamp(2.5rem, 8vw, 4rem);">Crea tu cuenta</h1>
      <p style="margin-bottom: 32px;">Regístrate para acceder a los cursos gratuitos de PPF y Cambio de Color.</p>
      
      <form action="#" method="POST" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="reg-name">Nombre completo</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Ej. Carlos Pérez" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" class="form-control" placeholder="carlos@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 8 caracteres" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="terms" required>
          <label for="terms">Acepto los <a href="#">Términos y Condiciones de Venta</a> y la política de privacidad de Track Creativo.</label>
        </div>

        <button type="submit" class="placeholder-button" style="width: 100%; border: none; cursor: pointer;">
          Comenzar formación gratis
        </button>
      </form>

      <div style="margin-top: 24px; font-size: 0.9rem; color: var(--muted);">
        ¿Ya tienes cuenta? <a href="mi-cuenta.html" style="color: var(--yellow); font-weight: 500;">Inicia sesión aquí</a>
      </div>
    </div>
  </main>
</body>
</html>
