<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta | INSTALLERSONTRUCK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="placeholder.css">
  <style>
    .login-container {
      max-width: 460px;
      margin: 0 auto;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--orange);
    }
    .login-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }
    .login-actions a {
      color: var(--muted);
      transition: color 0.2s;
    }
    .login-actions a:hover {
      color: var(--yellow);
    }
    .btn-back-corner {
      position: absolute;
      top: 24px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(255, 106, 0, 0.15);
      border: 1px solid var(--orange, #ff6a00);
      color: var(--orange, #ff6a00);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .btn-back-corner:hover {
      background: var(--orange, #ff6a00);
      color: #000;
      transform: translateX(-4px);
    }
    @media (max-width: 600px) {
      .btn-back-corner { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <a href="javascript:history.back()" class="btn-back-corner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Regresar
  </a>
  <main class="placeholder-page">
    <div class="placeholder-card">
      <span class="placeholder-eyebrow">Área de alumnos</span>
      <h1>Acceso al portal</h1>
      <p>Introduce tus credenciales para continuar con tus lecciones en streaming.</p>
      
      <div class="login-container">
        <form action="#" method="POST" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" placeholder="tu-correo@dominio.com" required>
          </div>

          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="login-actions">
            <label style="display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer;">
              <input type="checkbox"> Recordarme
            </label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="placeholder-button" style="width: 100%; border: none; cursor: pointer;">
            Entrar al panel
          </button>
        </form>

        <div style="margin-top: 32px; border-top: 1px solid var(--line); padding-top: 24px;">
          <span style="color: var(--muted); font-size: 0.95rem;">¿Eres nuevo instalador?</span>
          <br>
          <a class="placeholder-button placeholder-button-secondary" href="registro.html" style="margin-top: 14px; width: 100%;">
            Crear una cuenta nueva
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
